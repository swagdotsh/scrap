name: Build macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test macOS app
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    env:
      XCODE_VERSION: ${{ vars.XCODE_VERSION || '27.2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        env:
          XCODE_PATH: ${{ vars.XCODE_PATH }}
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcode="$XCODE_PATH"
          if [[ -z "$xcode" ]]; then
            candidates=$(ls -d /Applications/Xcode_"$XCODE_VERSION"*.app 2>/dev/null || true)
            xcode=$(printf '%s\n' $candidates | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1 || true)
            if [[ -z "$xcode" ]]; then
              xcode=$(printf '%s\n' $candidates | grep -iE '_rc|release_candidate' | sort -V | tail -1 || true)
            fi
            if [[ -z "$xcode" ]]; then
              xcode=$(printf '%s\n' $candidates | grep -i 'beta' | sort -V | tail -1 || true)
            fi
          fi
          if [[ -z "$xcode" || ! -d "$xcode" ]]; then
            echo "::error::Xcode $XCODE_VERSION isn't installed on this runner. Set the XCODE_PATH, XCODE_VERSION or MACOS_RUNNER repository variable."
            exit 1
          fi
          echo "Using $xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          xcodebuild -version

      - name: Create placeholder configuration
        shell: bash
        run: touch .env

      - name: Build universal Release app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project scrap.xcodeproj -scheme scrap -configuration Release \
            -derivedDataPath build/Release -destination 'generic/platform=macOS' \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO build

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project scrap.xcodeproj -scheme scrap -configuration Debug \
            -derivedDataPath build/Debug -destination 'platform=macOS' \
            -only-testing:scrapTests test \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
